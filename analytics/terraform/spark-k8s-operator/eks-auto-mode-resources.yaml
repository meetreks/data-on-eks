# EKS Auto Mode NodeClasses and NodePools for Spark Workloads
---
apiVersion: eks.amazonaws.com/v1
kind: NodeClass
metadata:
  name: spark-compute-optimized
spec:
  role: node_iam_role_name
  subnetSelectorTerms:
    - tags:
        Name: "*private*"
        kubernetes.io/role/internal-elb: "1"
  securityGroupSelectorTerms:
    - tags:
        Name: "*eks*cluster*sg*"
  ephemeralStorage:
    size: "200Gi"
    iops: 4000
    throughput: 250
  snatPolicy: Disabled
  tags:
    Workload: "spark-compute-optimized"
    Team: "analytics"

---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: spark-compute-optimized
spec:
  template:
    metadata:
      labels:
        type: "eks-auto-mode"
        NodeGroupType: "SparkComputeOptimized"
        multiArch: "Spark"
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: spark-compute-optimized
      requirements:
        - key: "karpenter.sh/capacity-type"
          operator: In
          values: ["spot", "on-demand"]
        - key: "kubernetes.io/arch"
          operator: In
          values: ["amd64"]
        - key: "eks.amazonaws.com/instance-category"
          operator: In
          values: ["c"]
        - key: "eks.amazonaws.com/instance-family"
          operator: In
          values: ["c5d"]
        - key: "eks.amazonaws.com/instance-size"
          operator: In
          values: ["4xlarge", "9xlarge", "12xlarge", "18xlarge", "24xlarge"]
        - key: "eks.amazonaws.com/instance-hypervisor"
          operator: In
          values: ["nitro"]
        - key: "eks.amazonaws.com/instance-generation"
          operator: Gt
          values: ["2"]
  limits:
    cpu: "1000"
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
  weight: 100

